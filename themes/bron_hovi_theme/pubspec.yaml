name: bron_hovi_theme
description: >-
  The Bron Hovi brand for the Action design system. The brand lives in its
  own package so action_design_system stays brand-agnostic — colour
  decisions change here, never in component code.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  action_design_system:
    path: ../../action_design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
